name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build and test universal binary
        run: |
          make test
          make clean
          make ARCH_FLAGS="-arch arm64 -arch x86_64" VERSION="${GITHUB_REF_NAME#v}"
          codesign --force --sign - build/horndis
          file build/horndis
      - name: Package
        run: |
          mkdir -p dist/horndis
          cp build/horndis README.md LICENSE dist/horndis/
          ditto -c -k --keepParent dist/horndis "dist/horndis-${GITHUB_REF_NAME}-macos-universal.zip"
          shasum -a 256 "dist/horndis-${GITHUB_REF_NAME}-macos-universal.zip" > "dist/horndis-${GITHUB_REF_NAME}-macos-universal.zip.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --generate-notes
