name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build and test universal binary
        run: |
          make test
          make clean
          make ARCH_FLAGS="-arch arm64 -arch x86_64" STATUS_ARCHS="arm64 x86_64" VERSION="${GITHUB_REF_NAME#v}"
          lipo -archs build/horndis | grep -q arm64
          lipo -archs build/horndis | grep -q x86_64
          lipo -archs build/horndis-status | grep -q arm64
          lipo -archs build/horndis-status | grep -q x86_64
          codesign --force --sign - build/horndis
          codesign --force --deep --sign - build/HoRNDISStatus.app
          file build/horndis
          file build/horndis-status
      - name: Package
        run: |
          mkdir -p dist/horndis
          cp build/horndis Scripts/horndis-install README.md LICENSE dist/horndis/
          cp -R build/HoRNDISStatus.app dist/horndis/
          ln -s "HoRNDISStatus.app/Contents/MacOS/horndis-status" dist/horndis/horndis-status
          cp -R docs dist/horndis/
          ditto -c -k --keepParent dist/horndis "dist/horndis-${GITHUB_REF_NAME}-macos-universal.zip"

          Scripts/build-package "${GITHUB_REF_NAME#v}" \
            "dist/HoRNDIS-Userspace-${GITHUB_REF_NAME}-macos-universal.pkg"

          shasum -a 256 "dist/horndis-${GITHUB_REF_NAME}-macos-universal.zip" > "dist/horndis-${GITHUB_REF_NAME}-macos-universal.zip.sha256"
          shasum -a 256 "dist/HoRNDIS-Userspace-${GITHUB_REF_NAME}-macos-universal.pkg" > "dist/HoRNDIS-Userspace-${GITHUB_REF_NAME}-macos-universal.pkg.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.pkg dist/*.zip dist/*.sha256 --generate-notes
